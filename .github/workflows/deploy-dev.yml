name: Deploy to Dev

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: ventriahq-api
  ECR_IMAGE_TAG: dev
  ECS_CLUSTER: ventriahq-dev-cluster
  ECS_SERVICE_API: ventriahq-dev-api
  ECS_SERVICE_SCHEDULER: ventriahq-dev-scheduler
  MIGRATION_TASK_DEF: ventriahq-dev-migration
  MIGRATION_SUBNETS: subnet-03558be7ce87add99,subnet-0b98ae3387437870f
  MIGRATION_SG: sg-0f0e6c6d1416f8ac1

jobs:
  deploy:
    name: Build, Migrate & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::089126833489:role/ventriahq-github-actions-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$ECR_IMAGE_TAG \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$ECR_IMAGE_TAG

      - name: Run database migrations
        id: migration
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition $MIGRATION_TASK_DEF \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$MIGRATION_SUBNETS],securityGroups=[$MIGRATION_SG],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT
          echo "Migration task started: $TASK_ARN"

          # Wait for task to finish (up to 5 minutes)
          aws ecs wait tasks-stopped \
            --cluster $ECS_CLUSTER \
            --tasks $TASK_ARN

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster $ECS_CLUSTER \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          echo "Migration exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed. Fetching logs..."
            aws logs filter-log-events \
              --log-group-name /ecs/ventriahq-dev/migration \
              --start-time $(( $(date +%s) - 600 ))000 \
              --query 'events[*].message' \
              --output text
            exit 1
          fi

          echo "Migrations applied successfully."

      - name: Deploy API service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE_API \
            --force-new-deployment \
            --query 'service.{status:status,desired:desiredCount}' \
            --output table

      - name: Deploy Scheduler service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE_SCHEDULER \
            --force-new-deployment \
            --query 'service.{status:status,desired:desiredCount}' \
            --output table

      - name: Wait for API service to stabilize
        run: |
          echo "Waiting for API service to reach steady state..."
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE_API
          echo "API service is stable."
